<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stimmtest Ina</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#151612;color:#d8d6c6;font:14px/1.45 system-ui,sans-serif;padding:16px;max-width:900px}
h1{font-size:18px;margin:0 0 4px}p.sub{color:#9a988a;margin:0 0 14px}
textarea{width:100%;box-sizing:border-box;height:70px;background:#22231d;color:inherit;border:1px solid #444;padding:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0}
.card{background:#1f201a;border:1px solid #3a3b32;padding:10px}
.card h2{font-size:15px;margin:0 0 4px}.card p{margin:0 0 8px;color:#a8a697;font-size:12.5px}
button{font:inherit;background:#3a3c2f;color:#eee;border:1px solid #666;padding:6px 12px;cursor:pointer;margin-right:6px}
button:hover{border-color:#d8b36a}
.sl{display:grid;grid-template-columns:110px 1fr 48px;gap:6px;align-items:center;margin:3px 0}
.sl input{width:100%}#status{color:#d8b36a;min-height:1.4em}
pre{background:#22231d;padding:8px;white-space:pre-wrap;font-size:12px}
</style></head><body>
<h1>Stimmtest · Ina als ältere Frau</h1>
<p class="sub">Grundlage: die Pico-Frauenstimme des Radiostudios. Die ersten Sekunden lädt die Sprachdatei.</p>
<textarea id="text">Die meisten Reisenden haben vorwiegend geographische oder völkerkundliche Interessen. Früher, als ich jung war, standen hier noch Birken bis ans Wasser.</textarea>
<div id="status"></div>
<div class="grid" id="presets"></div>
<div class="card"><h2>Eigene Mischung</h2><div id="sliders"></div>
<button id="playCustom">▶ Eigene abspielen</button><button id="stop">■ Stopp</button>
<pre id="json"></pre></div>
<script src="station/plane-radio.js?v=stimmtest1"></script>
<script src="station/plane-voice.inline.js?v=stimmtest1"></script>
<script>
(()=>{'use strict';
const PRESETS=[
 {id:'v99',name:'0 · Aktuell (v99)',desc:'Zum Vergleich: die jetzige Ina-Stimme.',voice:'pico-alt'},
 {id:'greisin',name:'1 · Greisin',desc:'Tief, langsam, unstete Tonhöhe, etwas Hauch und Rauheit.',v:{tempo:.74,pitch:.8,formant:.94,fx:{type:'aged',amount:1,jitter:.55,shimmer:.45,breath:.35,tremor:.45,tremorRate:5.2,rough:.35,dark:.45}}},
 {id:'hauch',name:'2 · Brüchig und hauchig',desc:'Wenig Kraft, viel Atem, Lautstärke schwankt.',v:{tempo:.78,pitch:.86,formant:.96,fx:{type:'aged',amount:1,jitter:.4,shimmer:.65,breath:.75,tremor:.25,tremorRate:5.8,rough:.15,dark:.55}}},
 {id:'zittrig',name:'3 · Zittrig',desc:'Deutliches, unregelmäßiges Stimmzittern (Alterstremor).',v:{tempo:.76,pitch:.84,formant:.95,fx:{type:'aged',amount:1,jitter:.45,shimmer:.35,breath:.25,tremor:.95,tremorRate:6,rough:.2,dark:.35}}},
 {id:'rau',name:'4 · Rau und knarrend',desc:'Tiefe, kratzige Stimme, wie nach vielen Zigaretten.',v:{tempo:.75,pitch:.72,formant:.92,fx:{type:'aged',amount:1,jitter:.6,shimmer:.4,breath:.2,tremor:.3,tremorRate:4.8,rough:.8,dark:.5}}},
 {id:'leise',name:'5 · Müde und leise',desc:'Sehr langsam, gedämpft, fast geflüstert.',v:{tempo:.68,pitch:.88,formant:.96,fx:{type:'aged',amount:1,jitter:.35,shimmer:.5,breath:.6,tremor:.3,tremorRate:5,rough:.2,dark:.75}}},
 {id:'hoch',name:'6 · Dünn und hoch',desc:'Höhere, dünne Altfrauenstimme (manche Ältere sprechen höher).',v:{tempo:.78,pitch:1.02,formant:1.04,fx:{type:'aged',amount:1,jitter:.6,shimmer:.5,breath:.45,tremor:.55,tremorRate:6.2,rough:.2,dark:.3}}},
];
const SL=[['tempo','Tempo',.5,1.2,.01],['pitch','Tonhöhe',.6,1.3,.01],['formant','Vokaltrakt',.82,1.15,.01],['jitter','Unstete Tonhöhe',0,1,.01],['shimmer','Lautstärke-Schwankung',0,1,.01],['breath','Hauch',0,1,.01],['tremor','Zittern',0,1,.01],['tremorRate','Zitter-Frequenz',3,8,.1],['rough','Rauheit',0,1,.01],['dark','Dumpfheit',0,1,.01]];
const $=id=>document.getElementById(id);let ac,speaker;
function ensure(){if(!ac){ac=new AudioContext();const g=ac.createGain();g.gain.value=1;g.connect(ac.destination);speaker=PlaneRadio.createSpeaker({context:ac,destination:g,workerFactory:window.PlaneRadioVoice?.createWorker});}if(ac.state!=='running')ac.resume();return speaker;}
async function play(voice,name){const sp=ensure();$('status').textContent='Erzeuge: '+name+' …';
 try{const ok=await sp.say($('text').value,{voice});$('status').textContent=ok?'Spielt: '+name:'';}catch(e){$('status').textContent='Fehler: '+e.message;}}
const custom=()=>{const v={};for(const [k]of SL)v[k]=+$('s_'+k).value;return{id:'eigene',engine:'pico',tempo:v.tempo,pitch:v.pitch,formant:v.formant,fx:{type:'aged',amount:1,jitter:v.jitter,shimmer:v.shimmer,breath:v.breath,tremor:v.tremor,tremorRate:v.tremorRate,rough:v.rough,dark:v.dark}};};
function showJson(){$('json').textContent=JSON.stringify(custom());}
function load(p){const v=p.v;if(!v)return;for(const [k]of SL){const val=k in v?v[k]:v.fx[k];$('s_'+k).value=val;$('o_'+k).textContent=(+val).toFixed(2);}showJson();}
for(const [k,label,min,max,step]of SL){const d=document.createElement('div');d.className='sl';d.innerHTML=`<label for="s_${k}">${label}</label><input id="s_${k}" type="range" min="${min}" max="${max}" step="${step}"><span id="o_${k}"></span>`;$('sliders').appendChild(d);
 d.querySelector('input').addEventListener('input',e=>{$('o_'+k).textContent=(+e.target.value).toFixed(2);showJson();});}
for(const p of PRESETS){const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${p.name}</h2><p>${p.desc}</p>`;
 const b=document.createElement('button');b.textContent='▶ Abspielen';b.onclick=()=>play(p.voice||{id:p.id,engine:'pico',...p.v},p.name);c.appendChild(b);
 if(p.v){const e=document.createElement('button');e.textContent='In Regler';e.onclick=()=>load(p);c.appendChild(e);}
 $('presets').appendChild(c);}
load(PRESETS[1]);
$('playCustom').onclick=()=>play(custom(),'Eigene Mischung');$('stop').onclick=()=>{speaker?.stop();$('status').textContent='';};
})();
</script></body></html>
